@if(!platformService.isBrowser()) {
  <ngx-spinner bdColor="rgba(51,51,51,0.8)" size="medium" color="#fff" type="ball-clip-rotate-pulse">
    <p style="font-size: 16px; color: white">Loading...</p>
  </ngx-spinner>
}
@if(platformService.isBrowser() && globalService.currentUser.isLogin()) {
  <app-header></app-header>
  <mat-sidenav-container class="scrollbar">
    <mat-sidenav opened mode="side" [style.width]="sidenavWidth()" 
                 (mouseenter)="onSidenavMouseEnter()"
                 (mouseleave)="onSidenavMouseLeave()">
      <app-sidebar [collapsed]="globalService.collapsed()" />
    </mat-sidenav>
    <mat-sidenav-content class="content scrollbar" [style.margin-left]="sidenavWidth()" >
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
}
@if(platformService.isBrowser() && !globalService.currentUser.isLogin()) {
  <app-login></app-login>
}
