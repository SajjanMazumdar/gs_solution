
<div class="flex {{data.class}}">
  <div class="dismiss">
    <button mat-icon-button>
      @if(data.icon == 'warning') {<mat-icon>notifications_none</mat-icon>}
      @if(data.icon == 'success') {<mat-icon>check</mat-icon>}
      @if(data.icon == 'info') {<mat-icon>error_outline</mat-icon>}
      @if(data.icon == 'error') {<mat-icon>close</mat-icon>}
    </button>
  </div>
  <div class="data">
   <span> {{data.icon}}</span> <br>
    {{data.message}}
  </div>
  <div class="close" (click)="snackBarRef.dismiss()">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18">
      <path fill="none" d="M0 0h24v24H0z"/>
      <path d="M12 10.586l4.95-4.95 1.414 1.414-4.95 4.95 4.95 4.95-1.414 1.414-4.95-4.95-4.95 4.95-1.414-1.414 4.95-4.95-4.95-4.95L7.05 5.636z"
        fill="rgba(0,0,0,0.66)"/>
    </svg>
  </div>
</div>
