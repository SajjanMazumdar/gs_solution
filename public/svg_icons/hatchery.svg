<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" fill="#FFFFFF"/>
  
  <!-- Expanded Tray (fills width) -->
  <rect x="5" y="65" width="90" height="20" rx="4" fill="#FFD15D" stroke="#5C3A21" stroke-width="3"/>
  <rect x="10" y="60" width="80" height="5" rx="3" fill="#3DC463" stroke="#5C3A21" stroke-width="3"/>
  
  <!-- Larger Eggs (scaled up) -->
  <ellipse cx="20" cy="50" rx="12" ry="15" fill="#FFFFFF" stroke="#292F33" stroke-width="2.5"/>
  <ellipse cx="40" cy="50" rx="12" ry="15" fill="#FFFFFF" stroke="#292F33" stroke-width="2.5"/>
  <ellipse cx="60" cy="50" rx="12" ry="15" fill="#FFFFFF" stroke="#292F33" stroke-width="2.5"/>
  <ellipse cx="30" cy="35" rx="12" ry="15" fill="#FFFFFF" stroke="#292F33" stroke-width="2.5"/>
  <ellipse cx="50" cy="35" rx="12" ry="15" fill="#FFFFFF" stroke="#292F33" stroke-width="2.5"/>
  
  <!-- Prominent Hatching Egg -->
  <ellipse cx="70" cy="35" rx="12" ry="15" fill="#FFFFFF" stroke="#292F33" stroke-width="2.5"/>
  <path d="M65 28 Q70 20 75 28" fill="none" stroke="#292F33" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="70" cy="30" r="8" fill="#FFEA00" stroke="#292F33" stroke-width="1.2"/>
  <circle cx="67" cy="28" r="3" fill="#292F33"/>
  <circle cx="73" cy="28" r="3" fill="#292F33"/>
  <path d="M70 35 L73 39 L68 39 Z" fill="#FFA500" stroke="#292F33" stroke-width="1"/>
  
  <!-- Enhanced Shadows -->
  <ellipse cx="20" cy="55" rx="10" ry="4" fill="rgba(0,0,0,0.12)"/>
  <ellipse cx="40" cy="55" rx="10" ry="4" fill="rgba(0,0,0,0.12)"/>
  <ellipse cx="60" cy="55" rx="10" ry="4" fill="rgba(0,0,0,0.12)"/>
  <ellipse cx="30" cy="40" rx="10" ry="4" fill="rgba(0,0,0,0.12)"/>
  <ellipse cx="50" cy="40" rx="10" ry="4" fill="rgba(0,0,0,0.12)"/>
  <ellipse cx="70" cy="40" rx="10" ry="4" fill="rgba(0,0,0,0.12)"/>
</svg>